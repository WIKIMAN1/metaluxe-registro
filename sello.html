<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar visita - Metaluxe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1210; color: #f0d9a8; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
  .card { background: #2a2018; border: 1px solid #d4af82; border-radius:20px; padding:32px; max-width:400px; width:100%; text-align:center; }
  .logo { width:80px; margin-bottom:16px; }
  h1 { font-size:22px; margin-bottom:8px; color:#f0d9a8; }
  .folio { font-size:14px; color:#8a7355; margin-bottom:20px; letter-spacing:2px; }
  .name { font-size:28px; margin-bottom:24px; color:#fff; }
  .btn { background: linear-gradient(135deg, #d4af82, #b8935a); color:#241a10; border:none; padding:16px 32px; font-size:18px; font-weight:bold; border-radius:12px; cursor:pointer; width:100%; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .msg { margin-top:20px; padding:12px; border-radius:8px; font-size:15px; display:none; }
  .msg.ok { background:#1a3a1a; color:#8f8; display:block; }
  .msg.err { background:#3a1a1a; color:#f88; display:block; }
  .loading { color:#8a7355; }
</style>
</head>
<body>
<div class="card">
  <img src="logo-trans.png" class="logo" alt="Metaluxe">
  <h1>Registrar visita</h1>
  <div class="folio" id="folio">...</div>
  <div class="name" id="name"><span class="loading">Cargando...</span></div>
  <button class="btn" id="btn" disabled>Confirmar visita de hoy</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzIKmPOsY4PcqvjsyctbSFn4IbyQ1EZoNX6PvOs6FPRn5eieHNGc43neFWsvsp9d8fa/exec';
const params = new URLSearchParams(location.search);
const folio = params.get('folio');
document.getElementById('folio').textContent = folio || 'Sin folio';

if (folio) {
  fetch(`${API}?api=cliente&folio=${encodeURIComponent(folio)}`)
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        document.getElementById('name').textContent = d.nombre;
        document.getElementById('btn').disabled = false;
      } else {
        showMsg('err', d.error || 'Clienta no encontrada');
      }
    })
    .catch(() => showMsg('err', 'Error de conexión'));
}

document.getElementById('btn').onclick = () => {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Registrando...';
  fetch(`${API}?api=sello&folio=${encodeURIComponent(folio)}`)
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        showMsg('ok', `✓ Visita registrada. ${d.nombre} ahora tiene ${d.sellos} sello(s).`);
        btn.textContent = 'Visita registrada';
      } else {
        showMsg('err', d.error || 'No se pudo registrar');
        btn.disabled = false;
        btn.textContent = 'Confirmar visita de hoy';
      }
    })
    .catch(() => {
      showMsg('err', 'Error de conexión');
      btn.disabled = false;
      btn.textContent = 'Confirmar visita de hoy';
    });
};

function showMsg(type, text) {
  const m = document.getElementById('msg');
  m.className = 'msg ' + type;
  m.textContent = text;
}
</script>
</body>
</html>
