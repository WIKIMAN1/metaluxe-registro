<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; display:flex; justify-content:center; padding:32px 16px; font-family:'Jost',sans-serif; }
  .wcard { width:360px; border-radius:28px; overflow:hidden; position:relative;
    background:#111;
    box-shadow: 0 24px 70px rgba(0,0,0,0.8), 0 0 0 1px rgba(212,175,130,0.25), 0 0 40px rgba(212,175,130,0.08); }
  .wtop { padding:28px 28px 22px; position:relative;
    background: radial-gradient(ellipse 120% 90% at 50% 0%, #2b2118 0%, #171310 55%, #0e0c0a 100%); }
  .wtop::before { content:''; position:absolute; inset:0; opacity:.5;
    background: radial-gradient(ellipse 60% 40% at 80% 10%, rgba(212,175,130,0.12), transparent 70%); pointer-events:none; }
  .wissuer { display:flex; align-items:center; gap:13px; margin-bottom:20px; position:relative; }
  .wissuer img { width:52px; height:52px; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.6)); }
  .wissuer .t { line-height:1.3; }
  .wissuer .t b { display:block; font-size:13px; letter-spacing:4px; color:#e8c98f; font-weight:500; }
  .wissuer .t i { display:block; font-size:10px; letter-spacing:2.5px; color:#8a7355; font-style:normal; }
  .wtitle { font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:700; color:#fdf8ef;
    letter-spacing:0.5px; margin-bottom:2px; position:relative;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  .wname { font-family:'Cormorant Garamond',serif; font-size:21px; font-style:italic; color:#d4af82;
    margin-bottom:16px; position:relative; }
  .wbadges { display:flex; gap:8px; position:relative; }
  .wbadge { font-size:11px; font-weight:600; letter-spacing:1.8px; padding:8px 16px; border-radius:100px; }
  .wbadge.gold { background: linear-gradient(135deg, #f0d9a8 0%, #d4af82 40%, #b8935a 70%, #e8c98f 100%);
    color:#241a10; box-shadow: 0 3px 12px rgba(212,175,130,0.35), inset 0 1px 0 rgba(255,255,255,0.5); }
  .wbadge.line { background:transparent; color:#d4af82; border:1px solid rgba(212,175,130,0.45); }
  .wdiv { height:1px; margin:20px 28px 0; background:linear-gradient(90deg, transparent, rgba(212,175,130,0.5), transparent); }
  .wqr { padding:22px 28px; display:flex; align-items:center; gap:18px;
    background: linear-gradient(180deg, #141110 0%, #0e0c0a 100%); }
  .wqr .qrframe { background:#fff; padding:8px; border-radius:14px; flex-shrink:0;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,130,0.4); }
  .wqr .qrbox { width:104px; height:104px; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#aaa; background:
    repeating-linear-gradient(0deg,#fff,#fff 8px,#f4f4f4 8px,#f4f4f4 16px); border-radius:6px; }
  .wqr .meta { color:#c9a96a; }
  .wqr .meta .folio { font-size:19px; font-weight:600; letter-spacing:3px; color:#f0d9a8; margin-bottom:6px; }
  .wqr .meta .hint { font-size:11px; letter-spacing:1px; color:#8a7355; }
  .whero { height:200px; background-size:cover; background-position:center; position:relative; }
  .whero::before { content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, #0e0c0a 0%, transparent 18%, transparent 82%, rgba(10,10,10,0.55) 100%); }
  .whero .cap { position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-size:10px; letter-spacing:4px; color:rgba(232,201,143,0.85); }
  .caption { text-align:center; color:#555; margin-top:20px; font-size:12px; letter-spacing:1px; max-width:360px; }
</style>
</head>
<body>
<div>
<div class="wcard">
  <div class="wtop">
    <div class="wissuer">
      <img src="logo-trans.png">
      <div class="t"><b>METALUXE</b><i>ESTHETIC · GUAYAQUIL</i></div>
    </div>
    <div class="wtitle">Esencial</div>
    <div class="wname">María Fernanda Silva</div>
    <div class="wbadges">
      <span class="wbadge gold">NIVEL 1 DE 5</span>
      <span class="wbadge line">★ 1 SELLO</span>
    </div>
  </div>
  <div class="wdiv"></div>
  <div class="wqr">
    <div class="qrframe"><div class="qrbox">[ QR ]</div></div>
    <div class="meta">
      <div class="folio">MLX-0001</div>
      <div class="hint">ESCANEA PARA<br>REGISTRAR VISITA</div>
    </div>
  </div>
  <div class="whero" style="background-image:url('card-esencial.jpg')"><div class="cap">PROGRAMA DE FIDELIDAD</div></div>
</div>
<p class="caption">Propuesta premium — dime qué ajustar</p>
</div>
</body>
</html>
