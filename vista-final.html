<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { background: #1a1a1a; display: flex; justify-content: center; padding: 20px; font-family: 'Segoe UI', sans-serif; }
  .wcard { width: 340px; border-radius: 20px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
  .wtop { background: #3D2B1F; padding: 20px; color: #f5e6d3; }
  .wissuer { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .wissuer img { width: 40px; height: 40px; }
  .wissuer span { font-size: 15px; letter-spacing: 1px; color: #e8c98f; }
  .wtitle { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .wname { font-size: 17px; color: #e8c98f; margin-bottom: 12px; letter-spacing: 0.5px; }
  .wlevel { font-size: 14px; color: #c9a96a; margin-bottom: 4px; }
  .wpoints { font-size: 14px; color: #c9a96a; }
  .wpoints b { font-size: 20px; color: #fff; }
  .wqr { background: #fff; margin: 16px; border-radius: 12px; padding: 16px; text-align: center; }
  .wqr .qrbox { width: 140px; height: 140px; background: #fff; border: 2px solid #3D2B1F; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; }
  .wqr .folio { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #3D2B1F; }
  .whero { height: 200px; background-size: cover; background-position: center; }
  .caption { text-align: center; color: #888; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div>
<div class="wcard">
  <div class="wtop">
    <div class="wissuer"><img src="logo-trans.png"><span>METALUXE ESTHETIC</span></div>
    <div class="wtitle">Metaluxe Esencial</div>
    <div class="wname">María Fernanda Silva</div>
    <div class="wlevel">NIVEL 1 DE 5</div>
    <div class="wpoints">Sellos: <b>1</b></div>
  </div>
  <div class="wqr">
    <div class="qrbox">[QR]</div>
    <div class="folio">MLX-0001</div>
  </div>
  <div class="whero" style="background-image:url('card-esencial.jpg')"></div>
</div>
<p class="caption">Vista previa: así se vería en Google Wallet</p>
</div>
</body>
</html>
