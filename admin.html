<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metaluxe Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',sans-serif; background:#1a1210; color:#f0d9a8; padding:16px; }
  .login { max-width:360px; margin:60px auto; background:#2a2018; border:1px solid #d4af82; border-radius:16px; padding:32px; text-align:center; }
  .login img { width:70px; margin-bottom:16px; }
  .login input { width:100%; padding:12px; margin:12px 0; border:1px solid #d4af82; border-radius:8px; background:#1a1210; color:#f0d9a8; font-size:16px; }
  .login button { width:100%; padding:14px; background:linear-gradient(135deg,#d4af82,#b8935a); border:none; border-radius:8px; font-size:16px; font-weight:bold; color:#241a10; cursor:pointer; }
  .dash { display:none; max-width:800px; margin:0 auto; }
  .dash.on { display:block; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-size:30px; letter-spacing:1px; margin:16px 0; text-align:center; }
  .detail h2 { font-family:'Cormorant Garamond',Georgia,serif; font-size:32px; letter-spacing:0.5px; }
  .detail h3 { font-family:'Cormorant Garamond',Georgia,serif; font-size:24px; letter-spacing:0.5px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { flex:1; padding:14px; background:#2a2018; border:1px solid #d4af82; border-radius:8px; text-align:center; cursor:pointer; color:#f0d9a8; }
  .tab.active { background:#d4af82; color:#241a10; font-weight:bold; }
  .panel { display:none; background:#2a2018; border:1px solid #d4af82; border-radius:12px; padding:24px; }
  .panel.active { display:block; }
  .item { background:#1a1210; border:1px solid #5a4a35; border-radius:8px; padding:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .item .info { flex:1; }
  .item .info b { color:#fff; }
  .item .info small { color:#8a7355; display:block; }
  .btn { padding:10px 18px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin-left:6px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:bold; margin-left:6px; white-space:nowrap; }
  .badge-esencial { background:#3D2B1F; color:#f0d9a8; border:1px solid #d4af82; }
  .badge-plata { background:#5A6C7D; color:#fff; }
  .badge-oro { background:#8B6914; color:#fff; }
  .badge-black { background:#0A0A0A; color:#d4af82; border:1px solid #d4af82; }
  .badge-embajadora { background:#3D0F2E; color:#f0d9a8; border:1px solid #d4af82; }
  .item.nivel-esencial { background:#2a211a; border-color:#8a6a45; }
  .item.nivel-plata { background:#2e3d4d; border-color:#5A6C7D; }
  .item.nivel-oro { background:#3d2f0a; border-color:#8B6914; }
  .item.nivel-black { background:#111111; border-color:#d4af82; }
  .item.nivel-embajadora { background:#2a0a1e; border-color:#a84a7a; }
  .detail.nivel-esencial { background:#241a12; border-color:#8a6a45; }
  .detail.nivel-plata { background:#1e2a38; border-color:#5A6C7D; }
  .detail.nivel-oro { background:#2a2008; border-color:#c9a227; }
  .detail.nivel-black { background:#0d0d0d; border-color:#d4af82; }
  .detail.nivel-embajadora { background:#220818; border-color:#a84a7a; }
  .detail.nivel-plata h2, .detail.nivel-plata h3 { color:#b8c9d9; }
  .detail.nivel-oro h2, .detail.nivel-oro h3 { color:#e8c874; }
  .detail.nivel-embajadora h2, .detail.nivel-embajadora h3 { color:#e8a8c8; }
  .btn.ok { background:#2a5a2a; color:#8f8; }
  .btn.no { background:#5a2a2a; color:#f88; }
  .btn.back { background:#5a4a35; color:#f0d9a8; margin-bottom:12px; }
  .btn.wa { background:#25D366; color:#fff; text-decoration:none; display:inline-block; }
  .fotos-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 14px; }
  .foto { text-align:center; }
  .foto img { width:100%; border-radius:8px; border:1px solid #3a2c1e; }
  .foto small { color:#d4af82; }
  .qrbox { text-align:center; padding:20px; }
  .qrbox img { width:220px; height:220px; background:#fff; padding:10px; border-radius:12px; }
  .msg { padding:10px; border-radius:6px; margin:10px 0; display:none; }
  .msg.err { background:#3a1a1a; color:#f88; display:block; }
  .detail { background:#1a1210; border:1px solid #d4af82; border-radius:12px; padding:24px; }
  .detail h2 { color:#fff; margin-bottom:12px; }
  .detail .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #2a2018; }
  .detail .row span:first-child { color:#8a7355; }
  .detail h3 { margin:16px 0 8px; color:#d4af82; }
  .hist { background:#2a2018; border-radius:6px; padding:10px; margin-bottom:8px; font-size:14px; }
  .hist b { color:#fff; }
  .hist small { color:#8a7355; }
</style>
</head>
<body>
<div class="login" id="login">
  <img src="logo-trans.png" alt="Metaluxe">
  <h1>Metaluxe Admin</h1>
  <input type="password" id="pw" placeholder="Contraseña" onkeypress="if(event.key==='Enter')login()">
  <button onclick="login()">Entrar</button>
  <div class="msg" id="lmsg"></div>
</div>
<div class="dash" id="dash">
  <h1>Panel Metaluxe</h1>
  <div class="tabs">
    <div class="tab active" onclick="showTab('cola',event)">Cola</div>
    <div class="tab" onclick="showTab('clientes',event)">Clientas</div>
    <div class="tab" onclick="showTab('qr',event)">QR del día</div>
  </div>
  <div class="panel active" id="p-cola"><div id="cola-list"><p style="color:#8a7355">Cargando...</p></div></div>
  <div class="panel" id="p-clientes">
    <div id="cli-list"><p style="color:#8a7355">Cargando...</p></div>
    <div id="cli-detail" style="display:none"></div>
  </div>
  <div class="panel" id="p-qr"><div class="qrbox"><p style="color:#8a7355;margin-bottom:12px">QR de registro para recepción</p><img src="qr-registro.png" alt="QR"><p style="margin-top:12px;font-size:13px;color:#8a7355">https://wikiman1.github.io/metaluxe-registro/</p></div></div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzIKmPOsY4PcqvjsyctbSFn4IbyQ1EZoNX6PvOs6FPRn5eieHNGc43neFWsvsp9d8fa/exec';
let PW = '';
function waNum(t) {
  t = String(t || '').replace(/\D/g, '');
  if (t.startsWith('593')) return t;
  if (t.startsWith('0')) return '593' + t.slice(1);
  if (t.length === 9) return '593' + t;
  return t;
}
function waLink(t, nombre) {
  const msg = 'Hola ' + (nombre || '') + ', te escribo de Metaluxe Sthetic 💛';
  return 'https://wa.me/' + waNum(t) + '?text=' + encodeURIComponent(msg);
}
function waBtn(t, nombre) {
  if (!t) return '';
  return `<a class="btn wa" href="${waLink(t, nombre)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>`;
}
function nivelKey(n) {
  return String(n || 'Esencial').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function nivelBadge(n) {
  const k = nivelKey(n);
  const map = {esencial:'badge-esencial', plata:'badge-plata', oro:'badge-oro', black:'badge-black', embajadora:'badge-embajadora'};
  const cls = map[k] || 'badge-esencial';
  return `<span class="badge ${cls}">${n || 'Esencial'}</span>`;
}
function login() {
  PW = document.getElementById('pw').value;
  fetch(`${API}?api=admin_cola&password=${encodeURIComponent(PW)}`)
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('dash').classList.add('on');
        loadCola(); loadClientes();
      } else {
        const m = document.getElementById('lmsg');
        m.className = 'msg err'; m.textContent = 'Contraseña incorrecta';
      }
    })
    .catch(() => {
      const m = document.getElementById('lmsg');
      m.className = 'msg err'; m.textContent = 'Error de conexión';
    });
}
function showTab(t, ev) {
  document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(e => e.classList.remove('active'));
  ev.target.classList.add('active');
  document.getElementById('p-'+t).classList.add('active');
}
function loadCola() {
  fetch(`${API}?api=admin_cola&password=${encodeURIComponent(PW)}`)
    .then(r => r.json()).then(d => {
      const el = document.getElementById('cola-list');
      if (!d.ok || !d.cola || d.cola.length === 0) { el.innerHTML = '<p style="color:#8a7355">Sin pendientes. Todo al día.</p>'; return; }
      el.innerHTML = d.cola.map(c =>
        `<div class="item"><div class="info"><b>${c.nombre}</b><small>${c.telefono} · ${c.tratamiento} · ${c.fecha}</small></div>
        ${waBtn(c.telefono, c.nombre)}<button class="btn ok" onclick="event.stopPropagation();aprobar('${c.folio}',1)">✓</button><button class="btn no" onclick="event.stopPropagation();aprobar('${c.folio}',0)">✗</button></div>`
      ).join('');
    });
}
function aprobar(folio, ok) {
  fetch(`${API}?api=admin_aprobar&password=${encodeURIComponent(PW)}&folio=${folio}&ok=${ok}`)
    .then(r => r.json()).then(() => loadCola());
}
function loadClientes() {
  fetch(`${API}?api=admin_clientes&password=${encodeURIComponent(PW)}`)
    .then(r => r.json()).then(d => {
      const el = document.getElementById('cli-list');
      document.getElementById('cli-detail').style.display = 'none';
      el.style.display = 'block';
      if (!d.ok || !d.clientes) { el.innerHTML = '<p>Error</p>'; return; }
      el.innerHTML = d.clientes.map(c =>
        `<div class="item nivel-${nivelKey(c.nivel)}" onclick="verCliente('${c.folio}')"><div class="info"><b>${c.nombre}</b><small>${c.folio} · ${c.sellos} sellos</small></div>${waBtn(c.telefono, c.nombre)}${nivelBadge(c.nivel)}<span style="color:#d4af82">›</span></div>`
      ).join('');
    });
}
function verCliente(folio) {
  fetch(`${API}?api=admin_historial&password=${encodeURIComponent(PW)}&folio=${folio}`)
    .then(r => r.json()).then(d => {
      if (!d.ok || !d.info) return;
      const i = d.info;
      document.getElementById('cli-list').style.display = 'none';
      const det = document.getElementById('cli-detail');
      det.style.display = 'block';
      det.innerHTML = `
        <button class="btn back" onclick="loadClientes()">← Volver</button>
        <div class="detail nivel-${nivelKey(i.nivel)}">
          <h2>${i.nombre}</h2>
          <div class="row"><span>Folio</span><span>${i.folio}</span></div>
          <div class="row"><span>Teléfono</span><span>${i.telefono||'-'}</span></div>
          ${i.telefono ? `<div class="row"><span>WhatsApp</span><span><a class="btn wa" href="${waLink(i.telefono, i.nombre)}" target="_blank" rel="noopener">Escribir por WhatsApp</a></span></div>` : ''}
          <div class="row"><span>Nivel</span><span>${nivelBadge(i.nivel)}</span></div>
          <div class="row"><span>Sellos</span><span>${i.sellos}</span></div>
          <div class="row"><span>Cumpleaños</span><span>${i.cumpleanos||'-'}</span></div>
          <div class="row"><span>Última visita</span><span>${i.ultima||'-'}</span></div>
          <div class="row"><span>Próxima cita</span><span>${i.proxima||'No agendada'}</span></div>
          <div class="row"><span>Estado</span><span>${i.estado||'-'}</span></div>
          ${i.notas ? `<div class="row"><span>Notas</span><span>${i.notas}</span></div>` : ''}
          <h3>Historial de tratamientos</h3>
          ${d.historial.length === 0 ? '<p style="color:#8a7355">Sin visitas registradas.</p>' :
            d.historial.map(h => `<div class="hist"><b>${h.tratamiento}</b><br><small>${h.fecha} · ${h.via} · ${h.estado}</small></div>`).join('')}
          <h3>Fotos antes / después</h3>
          <div id="fotos-box"><p style="color:#8a7355">Cargando fotos…</p></div>
        </div>`;
      loadFotos(i.folio);
    });
}
function fotoImg(enlace) {
  const m = String(enlace || '').match(/\/d\/([^\/]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800' : enlace;
}
function loadFotos(folio) {
  fetch(`${API}?api=admin_fotos&password=${encodeURIComponent(PW)}&folio=${folio}`)
    .then(r => r.json()).then(d => {
      const box = document.getElementById('fotos-box');
      if (!box) return;
      if (!d.ok || !d.fotos || d.fotos.length === 0) { box.innerHTML = '<p style="color:#8a7355">Sin fotos registradas todavía.</p>'; return; }
      const grupos = {};
      d.fotos.forEach(f => { const k = f.tratamiento + '|' + f.fecha; (grupos[k] = grupos[k] || []).push(f); });
      box.innerHTML = Object.entries(grupos).map(([k, fs]) => {
        const [trat, fecha] = k.split('|');
        const antes = fs.find(f => /antes/i.test(f.tipo || ''));
        const desp = fs.find(f => /desp/i.test(f.tipo || ''));
        const resto = fs.filter(f => f !== antes && f !== desp);
        const par = (f, etiq) => f ? `<div class="foto"><a href="${f.enlace}" target="_blank" rel="noopener"><img src="${fotoImg(f.enlace)}" alt="${etiq}"></a><br><small>${etiq}${f.notas ? ' · ' + f.notas : ''}</small></div>` : '';
        return `<h4 style="color:#d4af82;margin:10px 0 4px">${trat} · ${fecha}</h4><div class="fotos-grid">${par(antes, 'Antes')}${par(desp, 'Después')}${resto.map(f => par(f, f.tipo || '')).join('')}</div>`;
      }).join('');
    }).catch(() => { const box = document.getElementById('fotos-box'); if (box) box.innerHTML = '<p style="color:#8a7355">No se pudieron cargar las fotos.</p>'; });
}
</script>
</body>
</html>
