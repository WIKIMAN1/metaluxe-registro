<!DOCTYPE html>

<style>
  body { background: #222; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center; font-family: 'Segoe UI', sans-serif; }
  .wcard { width: 300px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .wtop { padding: 16px; }
  .wissuer { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .wissuer img { width: 32px; height: 32px; border-radius: 50%; }
  .wissuer span { font-size: 14px; color: #555; }
  .wtitle { font-size: 22px; font-weight: 600; color: #222; margin-bottom: 4px; }
  .wpoints { font-size: 13px; color: #777; }
  .wpoints b { font-size: 16px; color: #333; display: block; }
  .wbarcode { background: #f5f5f5; margin: 0 16px; border-radius: 8px; padding: 12px; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #333; }
  .whero { height: 180px; background-size: cover; background-position: center; }
  .wlabel { text-align: center; color: #fff; padding: 10px; font-weight: 600; }
</style>
</head>
<body>
<div>
<div class="wcard">

  </div>
